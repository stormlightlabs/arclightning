<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4f5f7" />
		<script>
			// Runs before CSS loads, so the theme-color values copy --arcl-canvas from packages/ui tokens.css.
			(() => {
				let stored = null;
				try {
					const value = localStorage.getItem('arcl-theme');
					if (value === 'light' || value === 'dark') stored = value;
				} catch {
					// Storage can be unavailable in privacy-restricted browsers.
				}
				document.documentElement.classList.add('js');
				if (stored) document.documentElement.dataset.arclTheme = stored;
				const theme = stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', theme === 'dark' ? '#09090b' : '#f4f5f7');
			})();
		</script>
		<script type="module" src="/search.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
