[package]
name = "arcl-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local-first project planning for developers and their agents"

[[bin]]
name = "arcl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arcl-core = { path = "../arcl-core" }
arcl-repo = { path = "../arcl-repo" }
arcl-serve = { path = "../arcl-serve" }
arcl-store = { path = "../arcl-store" }
clap.workspace = true
owo-colors.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
rusqlite.workspace = true
tempfile = "3.23"

[package.metadata.dist]
formula = "arcl"

# Point `cargo binstall` at the archives the release workflow uploads.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

# Windows archives are zips with the binary at the top level.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
