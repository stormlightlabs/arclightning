# Builds apps/website from the chosen branch and deploys it as a Cloudflare
# Pages preview with a branch alias on arclightning.pages.dev. Run it from the
# Actions tab. It refuses main; production deploys are not set up yet.
name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse main
        if: github.ref_name == 'main'
        run: |
          echo "::error::Preview deploys refuse main; pick another branch."
          exit 1

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @arclightning/website build

      # wrangler-action would run `pnpm add wrangler`, which pnpm refuses at a
      # workspace root. A global install on PATH is used as is.
      - run: npm install --global wrangler@4

      - name: Create the Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! out=$(wrangler pages project create arclightning --production-branch=main 2>&1); then
            echo "$out"
            grep -qi "already exists" <<<"$out" || exit 1
          fi

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/build --project-name=arclightning --branch=${{ github.ref_name }}

      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "### Preview of \`$BRANCH\`"
            echo
            if [ -n "$ALIAS_URL" ]; then echo "- Branch: $ALIAS_URL"; fi
            echo "- Deployment: ${DEPLOYMENT_URL:-not reported}"
          } >> "$GITHUB_STEP_SUMMARY"
