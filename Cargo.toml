[workspace]
members = [
    "crates/arcl-core",
    "crates/arcl-store",
    "crates/arcl-repo",
    "crates/arcl-cli",
    "crates/arcl-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
gix = { version = "0.85", default-features = false, features = ["status", "sha1"] }
owo-colors = { version = "4.3", features = ["supports-colors"] }
rmcp = { version = "3.7", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
toml = "1.1"
ulid = { version = "3", features = ["serde"] }
