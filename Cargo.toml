[package]
name = "arcl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# `status` transitively enables gix's local index, worktree, dirwalk, and diff support.
# `sha1` is required for ordinary Git repositories. Default and network-client features stay disabled.
gix = { version = "0.85", default-features = false, features = ["status", "sha1"] }
owo-colors = { version = "4.3", features = ["supports-colors"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
ulid = { version = "3", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.23"
